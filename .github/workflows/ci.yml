name: CI

on:
  push:
    branches: [ main ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary for benchmark
        run: cargo build --release
      - name: Run benchmark regression check
        run: npm run benchmark:ci
      - name: Install pinned watch regression dependencies
        run: |
          npm install --ignore-scripts --omit=optional --no-audit --no-fund --package-lock=false
          mkdir -p target/watch-import-evaluation-20261013/toolchain
          cp benchmarks/watch-incremental-20261014/cli-package.json target/watch-import-evaluation-20261013/toolchain/package.json
          cp benchmarks/watch-incremental-20261014/cli-lock.json target/watch-import-evaluation-20261013/toolchain/package-lock.json
          npm ci --prefix target/watch-import-evaluation-20261013/toolchain --ignore-scripts --no-audit --no-fund
      - name: Test watch runner failure handling
        shell: bash
        run: |
          set -o pipefail
          python3 -B -m unittest discover -s benchmarks/watch-incremental-20261014 -p test_runtime.py -v 2>&1 | tee target/watch-import-evaluation-20261013/runtime-tests.log
      - name: Run watch config regression
        shell: bash
        run: |
          set -o pipefail
          python3 -u benchmarks/watch-incremental-20261014/run.py --regression --sizes 300 --runs 1 2>&1 | tee target/watch-import-evaluation-20261013/regression.log
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            benchmarks/latest.json
            target/watch-import-evaluation-20261013/runtime-tests.log
            target/watch-import-evaluation-20261013/regression.log
            target/watch-import-evaluation-20261013/runs/*/results.json
            target/watch-import-evaluation-20261013/runs/*/logs/
            target/watch-import-evaluation-20261013/runs/*/snapshots/
            target/watch-import-evaluation-20261013/runs/*/fixtures/watch-regression-*/**/process.log

  node-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary for CLI wrapper smoke tests
        run: cargo build --release
      - name: Install local npm package
        run: npm install .
      - name: Run Node wrapper integration tests
        run: cargo test --test node_wrapper_integration --locked
      - name: Verify Node API fallback execution
        run: |
          node -e "(async()=>{const fs=require('fs');const os=require('os');const path=require('path');const api=require('./');const dir=fs.mkdtempSync(path.join(os.tmpdir(),'iturbo-ci-'));fs.mkdirSync(path.join(dir,'src'),{recursive:true});fs.writeFileSync(path.join(dir,'src','app.ts'),\"t('ci.hello')\\n\");process.chdir(dir);await api.extract({input:['src/**/*.ts'],output:'locales',locales:['en'],functions:['t']});if(!fs.existsSync(path.join(dir,'locales','en','translation.json'))){throw new Error('translation.json not created')}})().catch(e=>{console.error(e);process.exit(1)})"
      - name: Verify CLI command via npx --no-install
        run: |
          npx --no-install i18next-turbo --config benchmarks/fixtures/large/i18next-turbo.json extract
      - name: Build release addon with napi feature
        run: cargo build --release --features napi
      - name: Verify Node API native addon execution
        run: |
          node -e "(async()=>{const fs=require('fs');const os=require('os');const path=require('path');const api=require('./');const dir=fs.mkdtempSync(path.join(os.tmpdir(),'iturbo-native-ci-'));fs.mkdirSync(path.join(dir,'src'),{recursive:true});fs.writeFileSync(path.join(dir,'src','app.ts'),\"t('ci.native')\\n\");process.chdir(dir);const result=await api.extract({input:['src/**/*.ts'],output:'locales',locales:['en'],functions:['t']});if(!result||result.unique_keys!==1){throw new Error('unexpected extract result: '+JSON.stringify(result));}})().catch(e=>{console.error(e);process.exit(1)})"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run clippy
        run: cargo clippy --all-targets
      - name: Run tests
        run: cargo test --all
      - name: Run tests with napi feature
        run: cargo test --features napi

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: i18next-turbo-linux-x64-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: i18next-turbo-linux-x64-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: i18next-turbo-darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: i18next-turbo-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: i18next-turbo-win32-x64-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./scripts/package-binary.sh "${{ matrix.target }}" "${{ matrix.artifact }}" "i18next-turbo"
      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-binary.ps1 -Target "${{ matrix.target }}" -Artifact "${{ matrix.artifact }}" -BinaryName "i18next-turbo.exe"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
